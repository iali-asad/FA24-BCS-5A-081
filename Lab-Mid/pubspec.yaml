name: labmid
description: "DocuVerse PDF / PDFly - Modern PDF Reader, Scanner & Document Manager"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  uuid: ^4.3.3
  sqflite: ^2.3.3+1
  path_provider: ^2.1.3
  path: ^1.9.0
  flutter_pdfview: ^1.3.2
  pdf: ^3.10.8
  image_picker: ^1.1.2
  file_picker: ^8.0.5
  permission_handler: ^11.3.1
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  image: ^4.2.0
  share_plus: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sample.pdf
